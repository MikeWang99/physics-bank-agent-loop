name: PhysicsBank source-fidelity regression
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-fidelity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PhysicsBank validation dependencies
        run: python -m pip install -r skills/physics-bank/requirements.txt
      - name: Validate figure references, source assumptions and core bank rules
        run: |
          python -m unittest discover -s skills/physics-bank/tests -p test_student_fidelity_gate.py -v
          python -m unittest discover -s skills/physics-bank/tests -p test_validate_bank.py -v
